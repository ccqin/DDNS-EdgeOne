[project]
name = "eodo"
version = "0.1.14"
description = "EdgeOneDynamicOrigin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3.0",
    "PyYAML>=6.0,<7.0",
    "psutil>=5.9,<6.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
eodo = "eodo.app:main"

[tool.hatch.build]
sources = ["src"]
